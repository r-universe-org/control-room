on:
  workflow_dispatch:
    inputs:
      update_all_workflows:
        description: Force updating workflow files
        required: false
  schedule:
    - cron: '25 * * * *'

name: Sync all universes

jobs:
  update:
    name: Update submodules
    runs-on: ubuntu-latest
    steps:
      - name: Sync all universes
        uses: r-universe-org/sync@master
        with:
          monorepo_url: 'all'
          update_all_workflows: ${{ github.event.inputs.update_all_workflows }}
        env:
          GITHUB_PAT: ${{ secrets.GHPAT }}

  keep-alive:
    runs-on: ubuntu-latest
    needs: update
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update activity timestamp
        run: |
          git checkout -B activity-log
          mkdir -p .github
          date > .github/last-run.txt
          git add .github/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update activity timestamp [skip ci]"
          git push origin activity-log --force
